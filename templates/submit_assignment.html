{% extends "base.html" %}{% block title %}Submit Work{% endblock %}{% block content %}<div class="form card"><a href="{{url_for('dashboard')}}">← Back</a><span class="tag">{{assignment.subject}}</span><h1>{{assignment.title}}</h1><p><b>Due:</b> {{assignment.due_date}}</p><div class="instructions">{{assignment.description}}</div><form method="post" enctype="multipart/form-data"><label>Your answer</label><textarea name="answer" rows="8" placeholder="Type your answer...">{{old.answer if old else ''}}</textarea><label>Upload work</label><input type="file" name="file" accept=".pdf,.doc,.docx,.txt,.zip,.png,.jpg,.jpeg">{% if old and old.filename %}<p>Current file: {{old.filename}}</p>{% endif %}<button class="btn">Submit Assignment</button></form></div>{% endblock %}
